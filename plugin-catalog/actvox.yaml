known_issues:
  ["The upstream automatic inbox worker and pre-run gate depend on the removed built-in scheduler. They are unavailable; manual inbox access does not create unattended work.", "The inbox gate needs Node.js and the ActVox CLI (npm i -g @actvox/cli) on the gateway host.", "With plugins.isolation: host, the `hermes actvox` terminal commands are not available."]
