name: klipper-print-watch
repo: https://github.com/TakeshiTGAL/hermes-plugin-klipper-print-watch
sha: 1dd1391c171afd92825ec07a81b1efbaca5c64e0
description: "Moonraker HTTP API printer status and interactive pause/resume/cancel controls. Disclosure — talks to the configured Moonraker URL; plain HTTP sends MOONRAKER_API_KEY unencrypted. Controls request pre_tool_call approval while a person is present, but yolo or approvals-off can skip that prompt. Always for pause/resume covers the same action and origin only in interactive use; cancel asks each time. Unattended, webhook and isolated-plugin execution refuse printer movement, including after a saved approval. Anyone admitted to an enabled gateway can request and approve controls; there is no plugin-owned user list. Tools can be disabled per surface and the enabled skill appears in session indexes even on disabled surfaces. Optional vision checking is off by default and does not cancel a print. Not tested on real hardware."
maintainer: TakeshiTGAL
tier: community
category: tools
requires_hermes: ">=0.21.6"
docs_url: https://github.com/TakeshiTGAL/hermes-plugin-klipper-print-watch#readme
version: "0.2.2"
image: https://raw.githubusercontent.com/TakeshiTGAL/hermes-plugin-klipper-print-watch/1dd1391c171afd92825ec07a81b1efbaca5c64e0/assets/catalog-banner.png
platforms: []
capabilities:
  provides_tools:
  - klipper_status
  - klipper_control
  - klipper_watch
  provides_hooks:
  - pre_tool_call
  provides_middleware: []
  requires_env:
  - MOONRAKER_URL
known_issues: ["The pinned upstream klipper_watch script scheduling and execution-identity path require the removed built-in scheduler. Those paths are unavailable; the retained printer controls have not been runtime-tested against this fork."]
