name: mqtt
repo: https://github.com/JasonSwindle/hermes-mqtt
sha: 103ec28e9e2f68b080fd8e8074d0e5a98750e06e
description: "MQTT platform with an authenticated broker connection, per-topic agent/delivery/drop routing and replies outside the consumed namespace. Ships a standard-library MQTT 3.1.1/5.0 TCP/TLS client with certificate verification by default, optional private CA/mTLS, keepalive, reconnect and opt-in burst coalescing. Disclosure — holds an outbound broker connection and reconnect loop; reads scoped MQTT credentials and operator-selected TLS files. trusted_inbound makes broker ACLs the trust boundary: admitted publishers can start agent turns and configured delivery routes can post to another connected platform. Payload text cannot issue gateway commands. Cross-platform delivery uses gateway internals. No telemetry, shell or writes. The pinned upstream also has an unavailable scheduler-dependent route, as disclosed below."
maintainer: JasonSwindle
tier: community
category: platform
requires_hermes: ">=0.22.3,<0.23"
docs_url: https://github.com/JasonSwindle/hermes-mqtt#readme
version: "0.7.0"
title: "MQTT"
image: https://raw.githubusercontent.com/JasonSwindle/hermes-mqtt/103ec28e9e2f68b080fd8e8074d0e5a98750e06e/docs/banner.png
platforms: [linux, macos, windows]
known_issues:
  - "Job routing requires removed Hermes cron internals and is unavailable in this build. Whether those imports prevent the other MQTT routes from loading has not been verified."
  - "Intel Macs are not tested or supported (CI covers macos-latest, which is Apple Silicon)."
  - "trusted_inbound is on: every publisher the broker's ACL admits can start agent turns, so scope the broker account to the subscription filter and reply topic."
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - MQTT_HERMES_URL
    - MQTT_HERMES_PASSWORD
