name: jp-reinfolib
repo: https://github.com/TakeshiTGAL/hermes-plugin-reinfolib
sha: cfb17760af4b44df2057a262c16f90dfef5066ee
description: "Japanese quarterly real-estate transaction prices for one city through reinfolib_quarter: recorded sale count, median price and the first 20 rows. These are transaction prices, not published official land prices. Disclosure — sends REINFOLIB_API_KEY as Ocp-Apim-Subscription-Key to www.reinfolib.mlit.go.jp or the configured REINFOLIB_BASE_URL host. HTTP is refused except loopback, where the key is unencrypted. Anyone admitted to an enabled surface can use the key without approval; empty allowlists do not disable the tool. The slash command is outside hermes tools and must be restricted through command permissions or plugin disablement. Calls are separated by a one-second wait, stop after 30 seconds without bytes and have no retry or daily cap. HTTP 404 means no data for that request, not zero sales or unchanged prices. No file writes. The enabled skill appears in every session's skills index even where tools are disabled. 「このサービスは、国土交通省の不動産情報ライブラリのAPI機能を使用していますが、提供情報の最新性、正確性、完全性等が保証されたものではありません」"
maintainer: TakeshiTGAL
tier: community
category: tools
requires_hermes: '>=0.21.4'
docs_url: https://github.com/TakeshiTGAL/hermes-plugin-reinfolib#readme
version: 0.1.1
image: https://raw.githubusercontent.com/TakeshiTGAL/hermes-plugin-reinfolib/cfb17760af4b44df2057a262c16f90dfef5066ee/assets/catalog-banner.png
platforms: []
capabilities:
  provides_tools:
  - reinfolib_quarter
  provides_hooks: []
  provides_middleware: []
  requires_env:
  - REINFOLIB_API_KEY
known_issues: ["The upstream optional weekly-city blueprint requires removed automation/scheduling APIs and is unavailable. It is separate from the independently described reinfolib_quarter data query."]
