name: jp-kokkai
repo: https://github.com/TakeshiTGAL/hermes-plugin-kokkai
sha: 0c9bcfc49f64fd063131bf2676904f2ea166002c
description: "Japanese Diet meeting metadata, official URLs and short speech-text excerpts through kokkai_search and kokkai_speech. Speech here means parliamentary text, not audio transcription or synthesis. Disclosure — HTTPS GET only to kokkai.ndl.go.jp without an API key, with a 30-second request wait. Speech text is not stored. Tools have no private user list: anyone admitted to an enabled gateway surface can use them, including rooms with empty allowlists; hermes tools can disable a surface. The enabled read-meetings skill contributes to every session's skill index even where tools are disabled. Existing watch state remains in plugin-data/jp-kokkai after uninstall. Prior upstream tests used a stand-in server, not a live chat."
maintainer: TakeshiTGAL
tier: community
category: tools
requires_hermes: '>=0.21.6'
docs_url: https://github.com/TakeshiTGAL/hermes-plugin-kokkai#readme
version: "0.2.4"
image: https://raw.githubusercontent.com/TakeshiTGAL/hermes-plugin-kokkai/0c9bcfc49f64fd063131bf2676904f2ea166002c/assets/catalog-banner.png
platforms: []
capabilities:
  provides_tools:
  - kokkai_search
  - kokkai_speech
  - kokkai_watch
  provides_hooks:
  - pre_tool_call
  provides_middleware: []
known_issues: ["kokkai_watch and its setup/cleanup workflow require the removed scheduler and execution identity. They are unavailable; this listing does not make the upstream declared watch tool usable in this build."]
