description: "Read-only dashboard and model-free /duty and hermes duty summaries for waiting conversations, unanswered messages, running turns and undelivered background results. Disclosure — opens profile-local state.db in SQLite read-only mode for sessions, messages, turn leases, async delegations and goals, and reads gateway_state.json. Dashboard dismissals write only HERMES_HOME/duty-board/dismissed.json. Chat summaries require an in-process host and a configured owner; shared-chat summaries default to counts. No network calls, model calls, credentials or background processes."
