description: "Community learning missions, practice labs, written-answer grading, spaced reviews and self-issued Field Records. Beginner-to-advanced paths cover messaging, travel, cross-system work and boundaries; a Guide path includes client setup and recovery exercises. Disclosure — no network calls of its own, credentials, telemetry, shell commands, background processes or self-updates; source links open only on click. Registers six tools, two hooks, /academy and a skill. Interactive pre_llm_call can offer one practice; post_tool_call records the used tool. Scoring actions open a chat with the practice/grading prompt or use the clipboard on older hosts. The Desktop page reads host inventories. Progress, pasted documents, labs, review packets and records stay in profile plugin data. It can read a named UTF-8 file up to 5 MiB and hash a named recording. Guide labs create only synthetic credential files in their own folder and refuse a real Hermes home; selected operational evidence can read up to 25 log files of 2 MiB each and install-stamp.json. No private host imports."
