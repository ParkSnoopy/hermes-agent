name: Stable Release
run-name: Stable release ${{ inputs.tag }}

# Dispatch on the default branch, like canary: workflows and scripts come from main and
# Actions caches live in main's scope. The claim tag is an input. Admission resolves it to
# a commit and every lane that tests or builds the payload is passed that commit.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact annotated claim tag. Admission resolves it to the commit under test
        required: true
        type: string


permissions:
  contents: read

# Every reusable workflow called below inherits secrets (`secrets: inherit`)
# because their release-signing jobs need protected-environment secrets. A
# called workflow only sees them when the caller inherits AND the called job
# declares the environment: the job-level `environment:` alone attaches the
# deployment and exposes `vars`, but leaves `secrets.*` empty
# (actions/runner#1490). ci.yaml is deliberately excluded — it runs
# PR-controlled code and must stay secret-free.
concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  admit:
    name: Admit the claim
    # A read token cannot see a draft release, so gh release view answers
    # "release not found" for a draft that exists. Write is the permission
    # that can read it.
    permissions:
      contents: write
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      claim-tag: ${{ steps.admit.outputs.claim-tag }}
      claim-object: ${{ steps.admit.outputs.claim-object }}
      tag: ${{ steps.admit.outputs.tag }}
      commit: ${{ steps.admit.outputs.commit }}
      version: ${{ steps.admit.outputs.version }}
      release-id: ${{ steps.admit.outputs.release-id }}
      release-epoch: ${{ steps.admit.outputs.release-epoch }}
      # The claim's lanes (scripts/releases/lanes.py): `lanes` is one flag per lane and `jobs`
      # one run flag per lane-controlled job. Every job's `if` reads its own `jobs` entry, so the
      # lane table alone decides what runs and what the gates expect to have skipped.
      lanes: ${{ steps.admit.outputs.lanes }}
      jobs: ${{ steps.admit.outputs.jobs }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-pm
        with:
          cache-python: false
      - id: admit
        run: python -m scripts.releases.stable admit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CLAIM_TAG: ${{ inputs.tag }}

  ci:
    name: Full CI pipeline
    needs: admit
    if: fromJSON(needs.admit.outputs.jobs)['ci']
    permissions:
      contents: read
      pull-requests: write
      actions: read
      security-events: write
    uses: ./.github/workflows/ci.yaml
    with:
      commit: ${{ needs.admit.outputs.commit }}
      release: true

  docker:
    name: Docker build and tests
    needs: admit
    # The image publish-docker pushes is built here, so a claim that skipped
    # tests still runs this job with its tests off. It builds alongside the
    # gates; only the acceptance join waits for CI.
    if: >-
      !cancelled() && needs.admit.result == 'success' && fromJSON(needs.admit.outputs.jobs)['docker']
    uses: ./.github/workflows/docker.yml
    secrets: inherit
    with:
      commit: ${{ needs.admit.outputs.commit }}
      release-phase: test
      skip-tests: ${{ !fromJSON(needs.admit.outputs.lanes)['docker-tests'] }}
      tag: ${{ needs.admit.outputs.claim-tag }}
      version: ${{ needs.admit.outputs.version }}

  nix:
    needs: admit
    # The claim's policy removes it, not a gate it happens to need.
    if: fromJSON(needs.admit.outputs.jobs)['nix']
    uses: ./.github/workflows/nix.yml
    with:
      commit: ${{ needs.admit.outputs.commit }}
      release: true
      version: ${{ needs.admit.outputs.version }}

  pm-bundle:
    needs: admit
    if: fromJSON(needs.admit.outputs.jobs)['pm-bundle']
    uses: ./.github/workflows/pm-bundle.yml
    with:
      release: true
      ref: ${{ needs.admit.outputs.commit }}

  termux-checks:
    needs: admit
    if: fromJSON(needs.admit.outputs.jobs)['termux-checks']
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/termux-verify.yml
    secrets: inherit
    with:
      commit: ${{ needs.admit.outputs.commit }}
      release: true

  install-e2e:
    name: Install and update E2E
    needs: admit
    if: fromJSON(needs.admit.outputs.jobs)['install-e2e']
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/install-e2e.yml
    with:
      commit: ${{ needs.admit.outputs.commit }}
      release: true
      route: all
      tag-count: '3'
      exclude-ref: ${{ inputs.tag }}


  candidates-termux:
    name: Build signed release candidates (termux)
    needs: admit
    # Starts with the gates; the acceptance join is what requires CI.
    # Termux is off by default.
    if: >-
      !cancelled() && needs.admit.result == 'success' && fromJSON(needs.admit.outputs.jobs)['candidates-termux']
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
    uses: ./.github/workflows/termux-release.yml
    secrets: inherit
    with:
      tag: ${{ needs.admit.outputs.tag }}
      claim-tag: ${{ needs.admit.outputs.claim-tag }}
      claim-object: ${{ needs.admit.outputs.claim-object }}
      release-phase: candidate


  candidate-manifest:
    name: Stage verified stable candidate artifacts
    # A failed candidate call stages no accepted manifest.
    if: always() && fromJSON(needs.admit.outputs.jobs)['candidate-manifest']
    needs: [admit, candidates-termux]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: release-signing
    timeout-minutes: 90
    outputs:
      manifest-url: ${{ steps.manifest.outputs.manifest-url }}
      manifest-sha256: ${{ steps.manifest.outputs.manifest-sha256 }}
    env:
      RELEASE_TAG: ${{ needs.admit.outputs.tag }}
      RELEASE_CLAIM_TAG: ${{ needs.admit.outputs.claim-tag }}
      RELEASE_CLAIM_OBJECT: ${{ needs.admit.outputs.claim-object }}
      RELEASE_NEEDS: ${{ toJSON(needs) }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_R2_PUBLIC_URL: ${{ vars.CLOUDFLARE_R2_PUBLIC_URL }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          fetch-tags: true
      - uses: ./.github/actions/setup-pm
        with:
          cache-python: false
      - id: manifest
        run: python -m scripts.releases.stable candidate-manifest


  acceptance:
    name: All release acceptance checks pass
    if: always()
    needs: [admit, ci, docker, nix, pm-bundle, termux-checks, install-e2e,
            candidates-termux, candidate-manifest]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-pm
        with:
          cache-python: false
      - run: python -m scripts.releases.stable gate admit ci docker nix pm-bundle termux-checks install-e2e candidates-termux candidate-manifest
        env:
          RELEASE_NEEDS: ${{ toJSON(needs) }}
          LANES: ${{ needs.admit.outputs.lanes }}

  publish-docker:
    name: Publish tested Docker image
    # B5: this job pushes only the immutable attempt-ref image tags; the
    # stable/latest aliases move in the ordered publication pass.
    needs: [admit, docker]
    if: fromJSON(needs.admit.outputs.jobs)['publish-docker']
    uses: ./.github/workflows/docker.yml
    secrets: inherit
    with:
      commit: ${{ needs.admit.outputs.commit }}
      release-phase: publish
      tag: ${{ needs.admit.outputs.claim-tag }}
      version: ${{ needs.admit.outputs.version }}

  publish-bundles:
    name: Publish tested bundle artifacts
    needs: [admit, acceptance, candidate-manifest]
    # Inactive lanes may skip; the acceptance join judges the admitted policy.
    if: >-
      !cancelled() && fromJSON(needs.admit.outputs.jobs)['publish-bundles']
      && needs.acceptance.result == 'success' && needs.candidate-manifest.result == 'success'
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
    uses: ./.github/workflows/termux-release.yml
    secrets: inherit
    with:
      tag: ${{ needs.admit.outputs.tag }}
      claim-tag: ${{ needs.admit.outputs.claim-tag }}
      claim-object: ${{ needs.admit.outputs.claim-object }}
      release-phase: publish
      manifest-sha256: ${{ needs.candidate-manifest.outputs.manifest-sha256 }}


  publication:
    name: All artifact publication succeeded
    if: always()
    needs: [admit, acceptance, publish-docker, publish-bundles]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-pm
        with:
          cache-python: false
      - run: python -m scripts.releases.stable gate acceptance publish-docker publish-bundles
        env:
          RELEASE_NEEDS: ${{ toJSON(needs) }}
          LANES: ${{ needs.admit.outputs.lanes }}

  complete:
    name: Stable release is green
    if: always()
    needs: [admit, ci, docker, acceptance, candidate-manifest, publication, publish-docker]
    # GitHub-hosted with docker/setup-buildx-action, as before the runner migration: on
    # Blacksmith `imagetools create` cannot commit a manifest list to Docker Hub (404 on the
    # index commit, any buildx version): v0.22.3 rc.1-rc.4 died on it in the versioned manifest.
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-pm
        with:
          cache-python: false

      - run: python -m scripts.releases.stable gate admit ci docker acceptance candidate-manifest publication publish-docker
        env:
          RELEASE_NEEDS: ${{ toJSON(needs) }}
          LANES: ${{ needs.admit.outputs.lanes }}
      - name: Validate the accepted candidate archive
        if: fromJSON(needs.admit.outputs.lanes).bundles
        run: python -m scripts.releases.stable complete
        env:
          RELEASE_TAG: ${{ needs.admit.outputs.tag }}
          RELEASE_CLAIM_TAG: ${{ needs.admit.outputs.claim-tag }}
          RELEASE_CLAIM_OBJECT: ${{ needs.admit.outputs.claim-object }}
          CANDIDATE_MANIFEST_URL: ${{ needs.candidate-manifest.outputs.manifest-url }}
          CANDIDATE_MANIFEST_SHA256: ${{ needs.candidate-manifest.outputs.manifest-sha256 }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ vars.CLOUDFLARE_R2_PUBLIC_URL }}

      - name: Set up Docker Buildx for ordered alias promotion
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to Docker Hub for ordered alias promotion
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Reconcile ordered stable publication
        run: python -m scripts.releases.sequencer
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ''
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ vars.CLOUDFLARE_R2_PUBLIC_URL }}
