pre-commit:
  jobs:
    - name: lint python
      glob: "*.py" # glob filter
      run: just ruff {staged_files}


    - name: lint tui
      root: ui-tui/
      glob: "*.{js,ts,tsx}"
      run: just eslint {staged_files}

    - name: lint shared
      root: apps/shared/
      glob: "*.{js,ts,tsx}"
      run: just eslint {staged_files}

    - name: lint tests
      root: tests-js/
      glob: "*.{js,ts,tsx}"
      run: just eslint {staged_files}
