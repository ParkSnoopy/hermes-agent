description: "Field notes, known pitfalls and read-only patch-presence checks for a Hermes checkout, with declarative check files and explicit OK/MISSING/UPSTREAMED/N/A/UNKNOWN results. Ships historical pitfalls and recipes checked against upstream 0.22.0, not a compatibility guarantee for this fork. Portable skills package with no tools, hooks, middleware or environment requirements. Disclosure — its scripts inspect core files and Git status/diff but do not patch them. Skills can guide hand edits or owner re-apply scripts only after approval. Optional Telegram reporting reads the agent's bot token from environment or the upstream home credential file, and the public GitHub release/compare check is cached for twelve hours and can be disabled. Notes, indexes, state, locks and an installed helper are written under the upstream home layout. No automatic core edits."
