name: jp-egov-law
repo: https://github.com/TakeshiTGAL/hermes-plugin-egov-law
sha: 2e96dd28108250b374160077d6e1d9fa4dea55f1
description: "Japanese law lookup through the e-Gov Law API: search names/phrases, read an article as of a date and inspect amendments/enforcement dates, with the source credit required by e-Gov. Disclosure — sends lookup terms, law names, article numbers and dates only to laws.e-gov.go.jp, using its public API without a key; no file writes. Tools are exposed on enabled gateway surfaces, including guests admitted there; hermes tools can disable a surface. The enabled skill appears in every session's skills index even on disabled tool surfaces."
maintainer: TakeshiTGAL
tier: community
category: tools
docs_url: https://github.com/TakeshiTGAL/hermes-plugin-egov-law#readme
version: 0.1.3
image: https://raw.githubusercontent.com/TakeshiTGAL/hermes-plugin-egov-law/2e96dd28108250b374160077d6e1d9fa4dea55f1/assets/catalog-banner.png
requires_hermes: ">=0.21.4"
platforms: []
capabilities:
  provides_tools:
  - egov_law_search
  - egov_law_article
  - egov_law_revisions
  provides_hooks: []
  provides_middleware: []
  requires_env: []
known_issues: ["The pinned upstream weekly-amendment blueprint requires removed automation registration and scheduling APIs. That extension is unavailable; registration guards and retained law tools have not been runtime-tested against this fork."]
