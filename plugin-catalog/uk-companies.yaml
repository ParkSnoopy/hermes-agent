sha: e620676d9a1140322ce5efc8741cd8fc6d97f3c9
description: "UK company, officer, ownership, filing, charity, VAT and land lookups. Disclosure — company names/numbers go to api.company-information.service.gov.uk with HTTP Basic COMPANIES_HOUSE_API_KEY when supplied; registered names go to www.thegazette.co.uk without a key; charity queries go to api.charitycommission.gov.uk with CHARITY_COMMISSION_API_KEY when supplied; postcodes go to landregistry.data.gov.uk without a key. Double quotes are not sent. Requests wait at most twenty seconds and lookups stop after sixty seconds. Watch state remains in plugin-data/uk-companies after uninstall. Empty allowlists keep tools enabled; hermes tools can disable a surface. Contains HM Land Registry data © Crown copyright and database right 2021, licensed under the Open Government Licence v3.0."
