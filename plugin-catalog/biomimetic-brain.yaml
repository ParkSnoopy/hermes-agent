description: "Portable Agent Plugins v1 package for subsystem state, aggregate brain-state.json and a read-only PROCEED / CAUTION / VETO gate. The mind-kit skill seeds state and teaches the gate; stale subsystems report stale rather than asserting old values. Disclosure — registers no hooks, tools or middleware, has no network access and uses the Python standard library plus shell helpers. Scripts read and write JSON under MIND_AGENT_DIR, which defaults to agent/ inside the plugin install, and may execute scripts/batch-maintenance.sh or scripts/verify-invariants.py from that chosen directory. No direct model calls."
