title: Off-Peak Watch (offpeak-bekci)
description: "Ollama Cloud off-peak countdown, queue status and optional call-rate middleware. Off-peak hours are weekdays 18:00–12:00 UTC and one weekend block. Queue entries are not added automatically; approval uses the owner's typed choice. /offpeak-durum provides text or JSON status. Disclosure — llm_execution middleware ships measure-only (kuru_kosu: true); disabling that setting can delay calls during peak hours. It writes a JSONL measurement log and owner-approved queue changes, with no direct network calls, credentials or telemetry. English is the default output language; dil: tr selects Turkish. Gateway injection requires the owner's allow_gateway_injection permission. Hosts without an accessible persistent session key print request parameters instead of claiming delivery."
maintainer: onkanat
