name: bonsai-garden
title: Bonsai Garden
repo: "https://github.com/thehangingforest/bonsai-garden"
sha: "e02e93e8304b71ac66da62b639d620f87c0fcdaa"
description: "Isometric bonsai garden for the Desktop plugin SDK: profile trees reflect busy state, open their conversations on click and return to their shelf positions when idle. Includes local clock/date, movable artwork, shipped avatars and session-cost display. Disclosure — reads focused-session atoms and session title metadata through the SDK, and calls session.interrupt only when Stop is pressed. Reported costs remain reported; token-only costs are marked estimates and absent costs remain unavailable. No message content, transcripts, credentials, environment variables, core patches or outbound network requests. Derived from office-3d under its MIT lineage; no Python backend, model tools or login backend."
maintainer: thehangingforest
tier: community
category: desktop
requires_hermes: ">=0.20.0"
