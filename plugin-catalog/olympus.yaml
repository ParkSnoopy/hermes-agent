title: Olympus
description: "Manage your Hermes agents from one dashboard tab: every agent (profile) on one list with its status, current task and tool, helpers and a week of runs; one Needs-you queue of questions waiting on your answer, stalled or failing Kanban workers, blocked or unassigned tasks, offline gateways and looping or expensive runs, each with its action; an inspector per agent; a Live view of every open run with its subagents and their last tool; a Floor with every agent at a fixed place, moving only on recorded tool calls; a Pop out window of the roster that stays on top; and a Performance view of run success, run time, tool failures and cost per agent, each compared with the days before, with the runs behind any day a click away. Kanban controls (answer, retry, reclaim or reassign a task) are confirmed, logged and executed by Hermes' own dashboard and Kanban endpoints; `dashboard.olympus.controls: false` turns them off. Disclosure — reads Hermes' own stores read-only across every profile under HERMES_HOME (sessions and messages in state.db, run output and the usage ledger, the Kanban database, gateway state, config.yaml and profile.yaml, skills, the agent/gateway/error log tails and subagent live transcripts under cache/delegation/live) and writes to plugin-data/olympus/, plus `$HERMES_HOME/scripts/olympus_alerts.py` when you run `hermes olympus install-alerts`; controls (on by default, each confirmed; `dashboard.olympus.controls: false` turns them off) answer, retry, reclaim or reassign Kanban tasks through Hermes' own dashboard and Kanban endpoints; no network calls to third-party services, no shell commands, no background processes, no stored credentials and no self-updater; never opens a profile's .env (configured gateways come from Hermes' own helper, a private import the validator warns on); local labels, task titles, questions and message previews stay hidden unless `dashboard.olympus.expose_local_labels: true`; the Desktop page uses the plugin SDK only."
