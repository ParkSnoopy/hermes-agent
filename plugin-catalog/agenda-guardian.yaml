name: agenda-guardian
title: Agenda Guardian
repo: https://github.com/Moodtuner997/hermes-agenda-guardian
sha: 2493df2b4b85985faf7f19e4d9b6fe838b9ed5dd
version: "0.5.4"
description: "Day and week planning around calendar events, with owner-defined work hours, protected time, focus windows and task limits. Estimates adapt to completed tasks; proposals explain their rules and require confirmation before saving. Google Calendar writes are disabled until the owner enables them, are limited to validated proposals and plugin-marked events, and only its own recorded events can be removed. Includes chat, CLI, agent tools and a dashboard. Disclosure — no network by default. An ICS URL is fetched over HTTPS with public-address and same-host redirect restrictions, no proxy and a 5 MB limit. Google or command calendar sources execute an owner-configured program without a shell, with a 25-second timeout and a minimal environment. Onboarding reads timezone/language settings and checks for the Google skill and its sign-in file without opening that file. Calendar titles/times and recent history are read for planning. Rules, tasks, proposals and write records are stored in its own SQLite database. System-prompt and gateway-dispatch hooks interpret planning requests; a pre_tool_call hook requests approval for recognized alternate paths to calendar or plugin files, but is not a security boundary. No stored credentials, background process, middleware, telemetry or direct model calls."
maintainer: Moodtuner997
tier: community
category: tools
requires_hermes: ">=0.22.7"
docs_url: https://github.com/Moodtuner997/hermes-agenda-guardian#readme
readme: true
