name: brownout
title: Brownout
repo: https://github.com/Osiyomeoh/brownout
sha: 6d983d5da32c6cdd6a3551426de87d44a78dbfea
description: "Power observation and battery-runway alerts for the machine running Hermes. Disclosure — one daemon thread per Hermes home polls power at poll_seconds (default fifteen), using Linux /sys/class/power_supply, opt-in upsc for a NUT UPS, or the upstream macOS pmset reader. Notifications invoke hermes send with a thirty-second timeout using gateway credentials, and undelivered alerts are retried in order. State, event log, command queue and watcher lock stay under <HERMES_HOME>/plugin-data/brownout. The upstream pre_tool_call parking gate stops new calls rather than killing a running call; it deletes nothing. No direct network calls, credential reads or telemetry."
maintainer: Osiyomeoh
tier: community
category: automation
requires_hermes: ">=0.23.0"
docs_url: https://github.com/Osiyomeoh/brownout/blob/6d983d5da32c6cdd6a3551426de87d44a78dbfea/README.md
version: "0.1.0"
platforms: [linux, macos]
known_issues:
  ["The pinned upstream park/recovery workflow also pauses and resumes built-in scheduler jobs. That part is unavailable. Automatic critical-battery parking must not be treated as compatible until its retired-API dependency is reviewed; the independent alerts have not been runtime-tested here.", "Proven on real hardware on macOS (pmset). Linux sysfs and NUT UPS readers are covered by parser tests on recorded formats only."]
capabilities:
  provides_tools: []
  provides_hooks: [pre_tool_call]
  provides_middleware: []
  requires_env: []
