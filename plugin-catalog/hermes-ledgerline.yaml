description: "Desktop session-cost and usage inspection. Disclosure — reads session lists, detail, search and usage analytics through the raw window.hermesDesktop.api bridge, and runs hermes version, hermes insights and hermes send --list through cli.exec. Explain/audit actions, only when requested, send a selected session digest and optionally tool arguments to the configured model as a new session or background prompt. User-selected test messages and alerts use hermes send. Budgets, dismissed tips, scans and saved answers stay in Desktop plugin storage. No other destination and no model tools."
