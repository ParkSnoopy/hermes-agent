description: "Japanese subsidy search and detail through the public jGrants API. Disclosure — queries api.jgrants-portal.go.jp without an API key or daily cap; each call waits at most 60 seconds and retries at most twice. Search matches do not establish completeness. The plugin has no user list: anyone admitted to an enabled gateway can use its tools; a Chatwork room without CHATWORK_ALLOWED_USERS admits all its participants. hermes tools controls tool surfaces but not /subsidies, which needs command permissions or plugin disablement. The enabled skill appears in every session's skills index even where tools are disabled. Persistent watch state remains in plugin-data/jp-subsidies. The plugin does not record the requesting person's identity. Not tested against a live gateway, the Chatwork plugin or very large result sets."
maintainer: TakeshiTGAL
