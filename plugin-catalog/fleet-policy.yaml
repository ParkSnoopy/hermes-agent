description: "Managed-scope administration: compares effective model, reasoning effort and service tier with observed provider requests through hermes fleet-policy status --json. Disclosure — pre_api_request, pre_auxiliary_call and pass-through llm_execution middleware record only model/effort/tier per role, without messages, headers or keys, in HERMES_HOME/fleet-policy/observed.json. The operator's watch CLI can call one MCP read tool at a configured server_url, expand configured environment references into headers, follow redirects and save seen IDs at the configured state path. That probe is an independent operator command, not an installed background service. No other network access or telemetry."
