name: index-search
repo: https://github.com/TakeshiTGAL/hermes-plugin-index-search
sha: a8d522160c78ad13f3c887905c67f40f3cb984a1
description: "Search an operator-managed Meilisearch index through index_search and inspect it through index_health. Local notes/files must be indexed there first; it does not search the filesystem itself. Disclosure — sends MEILI_API_KEY as a Bearer token to MEILI_HOST, including over unencrypted HTTP if configured. Use a search-only key; an admin key is sent as supplied. Tools are exposed on enabled gateway surfaces without a separate user list, and hermes tools can disable a surface. The enabled skill appears in session skills indexes even when tools are disabled. Saved-query writes use agent.file_safety."
maintainer: TakeshiTGAL
tier: community
category: tools
docs_url: https://github.com/TakeshiTGAL/hermes-plugin-index-search#readme
version: "0.1.4"
requires_hermes: ">=0.21.6"
image: https://raw.githubusercontent.com/TakeshiTGAL/hermes-plugin-index-search/a8d522160c78ad13f3c887905c67f40f3cb984a1/assets/catalog-banner.png
platforms: []
capabilities:
  provides_tools:
  - index_search
  - index_health
  - index_watch
  provides_hooks: []
  provides_middleware: []
  requires_env:
  - MEILI_HOST
  - MEILI_API_KEY
known_issues: ["The upstream index_watch scheduling recipe requires the removed built-in scheduler. Do not use its generated scheduling commands; saved queries do not establish automatic monitoring in this build."]
