name: switchbot-control
repo: https://github.com/TakeshiTGAL/hermes-plugin-switchbot-control
sha: f0ecbf266ee528fa0db895e222ade31135461ca0
description: "SwitchBot OpenAPI v1.1 device listing and interactive control for personal use. Plug Mini commands can change on/off state; the upstream watch does not report that state. Locks and doors are refused unless safety_devices is enabled; then each lock/door action asks again. setPosition supports Curtain/Curtain3, with zero meaning open. Disclosure — sends active-profile SWITCHBOT_TOKEN and SWITCHBOT_SECRET only to api.switch-bot.com and ignores HTTP proxy environment settings. While a person is present, yolo/approvals-off can bypass ordinary command approval. A saved approval covers the same device, command and parameter during interactive use, not unattended or webhook calls. Anyone admitted to an enabled gateway can request and approve controls; there is no plugin user list. Toolsets can be disabled per surface. State stays in active-profile plugin data and the enabled skill appears in all session indexes, even where tools are disabled. Not tested on real devices."
maintainer: TakeshiTGAL
tier: community
category: tools
requires_hermes: '>=0.21.6'
docs_url: https://github.com/TakeshiTGAL/hermes-plugin-switchbot-control#readme
version: "0.2.2"
image: https://raw.githubusercontent.com/TakeshiTGAL/hermes-plugin-switchbot-control/f0ecbf266ee528fa0db895e222ade31135461ca0/assets/catalog-banner.png
platforms: []
capabilities:
  provides_tools:
  - switchbot_devices
  - switchbot_command
  - switchbot_watch
  provides_hooks:
  - pre_tool_call
  provides_middleware: []
  requires_env:
  - SWITCHBOT_TOKEN
  - SWITCHBOT_SECRET
known_issues: ["The upstream switchbot_watch script scheduling and cleanup workflow depends on the removed built-in scheduler and is unavailable. Do not infer automatic monitoring from the retained device controls."]
