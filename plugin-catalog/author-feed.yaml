name: author-feed
repo: https://github.com/TakeshiTGAL/hermes-plugin-author-feed
sha: d3c9497d3f62b7f49aa0fa6131a7cd30278d80a8
description: "Read public Bluesky profiles and posts through profile_get and author_feed, without signing in. Disclosure — HTTPS GET only to public.api.bsky.app, with no API key. Tools are available on enabled gateway surfaces without approval, so anyone admitted there can call them; hermes tools can disable a surface. While enabled, the plugin skill contributes a line to each session's skills index, even on surfaces where its tools are disabled. Plugin state remains under <HERMES_HOME>/plugin-data/author-feed after uninstall. The pinned plugin relies on private host APIs."
maintainer: TakeshiTGAL
tier: community
category: tools
requires_hermes: '>=0.21.6'
docs_url: https://github.com/TakeshiTGAL/hermes-plugin-author-feed#readme
version: '0.2.3'
image: https://raw.githubusercontent.com/TakeshiTGAL/hermes-plugin-author-feed/d3c9497d3f62b7f49aa0fa6131a7cd30278d80a8/assets/catalog-banner.png
platforms: []
capabilities:
  provides_tools:
  - profile_get
  - author_feed
  - author_watch
  provides_hooks: []
  provides_middleware: []
known_issues: ["author_watch and the upstream schedule/unschedule workflow require the removed built-in scheduler and its execution identity/store. They are unavailable here; the declared tool list still describes the pinned upstream plugin, not a claim that every tool works in this fork."]
