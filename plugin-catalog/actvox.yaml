description: "ActVox workspace task and inbox access through the user's actvox MCP server and CLI, with actvox skills, a first-turn inbox note and /actvox inbox|status. Disclosure — MCP calls require the plugin's mcp_allowlist; the first-turn pre_llm_call inbox lookup waits up to five seconds and can reveal task/mention counts in the session. The plugin holds no credential and sends no telemetry. The upstream explicit install-gate command writes only its own inbox-gate helper under the profile's scripts folder; plugin state stays under HERMES_HOME/plugin-data/actvox. Assignments and mentions are controlled by workspace participants, so task contents are third-party input, not operator approval."
maintainer: ActVox
tier: community
category: automation
docs_url: https://github.com/ActVox/actvox-plugins/tree/main/hermes
requires_hermes: ">=0.22.5"
