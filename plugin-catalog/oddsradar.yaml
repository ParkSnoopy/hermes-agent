sha: dfafcd59e6d2efeb4fd9cffa832836b1637c07c7
description: "Read-only Polymarket market search, live midpoint odds and moves, volume, sparklines and per-profile watchlists through tools, /odds and the CLI. No keys, wallets or trading. Disclosure — HTTPS GET only to gamma-api.polymarket.com and clob.polymarket.com, with ten-second timeouts and at most two retries for 429/5xx; other hosts are refused. Saves watchlist rules in <HERMES_HOME>/plugin-data/oddsradar/watchlist.json. The upstream script-generator command writes a helper under the profile's scripts directory; that helper invokes the local CLI as argv, without a shell, with stdin closed and a 120-second timeout. No hooks, middleware, background threads, telemetry or self-updates."
