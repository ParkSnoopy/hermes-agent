name: google_meet
version: 0.2.0
description: "Join a Google Meet call, collect Google-provided live captions, and follow up afterwards. Supports approved remote nodes. Only explicitly supplied meet.google.com URLs are joined; no calendar scanning or auto-dial."
author: NousResearch
kind: standalone
platforms:
  - linux
  - macos
provides_tools:
  - meet_join
  - meet_leave
  - meet_status
  - meet_transcript

provides_hooks:
  - on_session_end
