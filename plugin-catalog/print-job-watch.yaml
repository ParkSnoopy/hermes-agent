name: print-job-watch
repo: https://github.com/TakeshiTGAL/hermes-plugin-print-job-watch
sha: 61cf86ed8c1a348c2d9956368e1abf7f51bb40fa
description: "OctoPrint status and interactive pause/resume/cancel controls. OctoPrint is a registered trademark of Gina Häußge (https://octoprint.org). Disclosure — requests use OCTOPRINT_URL and OCTOPRINT_API_KEY for one origin; an optional webcam still on another port is fetched without the key. Plain HTTP exposes the key; authenticated redirects are not followed, even to the same origin. Controls request pre_tool_call approval while a person is present; yolo/approvals-off can skip it. A saved pause/resume approval covers that action/origin only during interactive use; cancel asks every time. Unattended, webhook and isolated-plugin execution refuse printer movement, including after saved approval. There is no plugin-owned user list. Anyone admitted to an enabled gateway can request and approve controls; hermes tools does not remove the slash command. The enabled skill appears in session indexes even when tools are disabled. State remains in plugin data. Not tested on a physical printer, with access control off or with the stock webcam."
maintainer: TakeshiTGAL
tier: community
category: tools
requires_hermes: ">=0.21.6"
docs_url: https://github.com/TakeshiTGAL/hermes-plugin-print-job-watch#readme
version: "0.2.1"
image: https://raw.githubusercontent.com/TakeshiTGAL/hermes-plugin-print-job-watch/61cf86ed8c1a348c2d9956368e1abf7f51bb40fa/assets/catalog-banner.png
platforms: []
capabilities:
  provides_tools:
  - print_job_status
  - print_job_control
  - print_job_watch
  provides_hooks:
  - pre_tool_call
  provides_middleware: []
  requires_env:
  - OCTOPRINT_URL
  - OCTOPRINT_API_KEY
known_issues: ["The upstream print_job_watch scheduling/script workflow requires the removed built-in scheduler and is unavailable. Interactive status/control support does not imply a background watch."]
