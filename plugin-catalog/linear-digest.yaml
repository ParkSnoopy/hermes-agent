name: linear-digest
repo: https://github.com/TakeshiTGAL/hermes-plugin-linear-digest
sha: cb8cac04dbe3839bf75557757df56d3f3c31e3e9
description: "Read open, non-archived Linear issues assigned to you through linear_digest. Disclosure — reads LINEAR_API_KEY from the active profile for each request and sends it as the Authorization value, without a Bearer prefix, in up to ten HTTPS POSTs to api.linear.app/graphql. Redirects and proxies are disabled. Nothing is downloaded at runtime; the shipped schema is about 1.3 MB. The read-only tool is available to anyone admitted to enabled gateway surfaces; hermes tools can disable a surface. The linear-issues skill is registered with it. Settings stay under <HERMES_HOME>/plugin-data/linear-digest. An HTTP loopback LINEAR_DIGEST_REHEARSAL endpoint receives the key in clear text; other rehearsal values fetch nothing."
maintainer: TakeshiTGAL
tier: community
category: tools
requires_hermes: '>=0.21.4'
