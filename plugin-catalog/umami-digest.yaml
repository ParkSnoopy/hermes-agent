name: umami-digest
title: Umami Digest
repo: https://github.com/TakeshiTGAL/hermes-plugin-umami-digest
sha: b20529c1c87791749b49c3b3f03838dcb62397cd
description: "Read yesterday's Umami pageviews, visitors, day-over-day change, top pages and surge flag through umami_digest. On Umami 3.4.1 it reads expanded paths in pages of 500, stopping after a short page or twenty pages, then ranks by pageviews; capped results identify the inspected subset. Disclosure — GET only to UMAMI_URL with Authorization Bearer UMAMI_API_KEY. Plain HTTP is permitted only on loopback; otherwise HTTPS is required. No runtime downloads. The read-only tool asks no approval, so anyone admitted to an enabled gateway can call it; hermes tools can disable a surface. State remains in plugin-data/umami-digest after removal."
maintainer: TakeshiTGAL
tier: community
category: tools
requires_hermes: '>=0.21.4'
docs_url: https://github.com/TakeshiTGAL/hermes-plugin-umami-digest#readme
version: '0.1.0'
image: https://raw.githubusercontent.com/TakeshiTGAL/hermes-plugin-umami-digest/b20529c1c87791749b49c3b3f03838dcb62397cd/assets/catalog-banner.png
platforms: []
capabilities:
  provides_tools:
  - umami_digest
  provides_hooks: []
  provides_middleware: []
  requires_env:
  - UMAMI_URL
  - UMAMI_API_KEY
  - UMAMI_WEBSITE_ID
known_issues: ["The upstream schedule/unschedule workflow requires the removed built-in scheduler and is unavailable. The manual digest does not provide automatic morning delivery."]
