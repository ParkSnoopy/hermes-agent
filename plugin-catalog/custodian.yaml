name: custodian
repo: https://github.com/indigokarasu/hermes-custodian-plugin
sha: d5b4ebfd2353a29380a51c8bcba84d4682cf4c91
version: "3.0.1"
description: "Operational log and skill-journal inspection with a fingerprint registry, issue ledger, manual scan/health tools and dashboard. Disclosure — reads gateway logs, per-skill journals and agent data under HERMES_HOME; repair actions write there and issues are recorded in an append-only ledger. The upstream plugin can auto-repair its Tier 1 findings and escalate others, so it is not a read-only repair tool. No network I/O or credentials."
maintainer: indigokarasu
tier: community
category: automation
docs_url: https://github.com/indigokarasu/hermes-custodian-plugin#readme
readme: true
platforms: []
capabilities:
  provides_tools:
    - custodian_status
    - custodian_scan
    - custodian_issues
    - custodian_cron_health
  provides_hooks:
    - post_tool_call
    - on_session_end
    - on_session_start
    - on_session_reset
  provides_middleware: []
  requires_env: []
known_issues: ["The upstream init, scheduling, scheduled-job health checks and unattended escalation runner require the removed built-in scheduler. Do not run those setup paths; retained manual scanning has not been runtime-tested against this fork."]
